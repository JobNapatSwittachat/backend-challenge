syntax = "proto3";

package user.v1;

import "google/protobuf/timestamp.proto";

// The Go import path is set by buf managed mode (see buf.gen.yaml), so it is
// not hardcoded here.

// UserService mirrors the CreateUser and GetUser use cases over gRPC.
// All RPCs except CreateUser require an "authorization: Bearer <jwt>"
// metadata entry, enforced by a server interceptor.
service UserService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
}

message User {
  string id = 1;
  string name = 2;
  string email = 3;
  google.protobuf.Timestamp created_at = 4;
}

message CreateUserRequest {
  string name = 1;
  string email = 2;
  string password = 3;
}

message CreateUserResponse {
  User user = 1;
}

message GetUserRequest {
  string id = 1;
}

message GetUserResponse {
  User user = 1;
}
