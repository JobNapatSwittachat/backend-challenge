services:
  api:
    build: .
    ports:
      - "8080:8080" # HTTP
      - "9090:9090" # gRPC
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: user_management
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_TTL: 24h
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo-data:
